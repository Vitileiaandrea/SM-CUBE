[tool.poetry]
name = "fm7000"
version = "0.1.0"
description = "FM 7000 Filling Machine - Hybrid rule-based + RL system for automated meat cube packing"
authors = ["Vitileiaandrea"]
readme = "README.md"
packages = [{include = "fm7000"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
gymnasium = "^0.29.0"
stable-baselines3 = "^2.2.0"
scipy = "^1.11.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
